name: Test and build installers
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PlexPorter-Windows-x64
          path: dist/PlexPorter.exe
  debian:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pip python3-venv python3-tk libpython3.10 binutils
      - run: /usr/bin/python3 -m venv build/venv
      - run: build/venv/bin/python -m pip install --upgrade pip setuptools wheel
      - run: build/venv/bin/python -m pip install . pyinstaller
      - run: build/venv/bin/python scripts/collect_licenses.py
      - run: build/venv/bin/python -m PyInstaller --noconfirm --clean --onedir --add-data "$PWD/build/licenses:licenses" --name PlexPorter --distpath build/linux-dist --workpath build/linux-freeze --specpath build run.py
      - run: build/venv/bin/python scripts/build_deb.py build/linux-dist/PlexPorter
      - run: dpkg-deb --info dist/plex-porter_0.5.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: PlexPorter-Xubuntu-amd64
          path: dist/*.deb
